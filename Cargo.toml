[package]
name = "sawmill"
version = "0.1.0"
edition = "2024"
description = "Sawmill — Dissecting Logs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1"
glob = "0.3"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tui-input = { version = "0.15.5", default-features = false, features = ["crossterm"] }
